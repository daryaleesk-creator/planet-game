<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коты-спасатели: миссия «Планета Земля»</title>
<style>
:root{--bg:#fde9ee;--bg2:#d9eef0;--card:#fff;--ink:#1d2a3f;--mut:#5b6b80;--acc:#e0446f;--acc2:#1f8f8a;--ok:#14855a;--okb:#d8f3e6;--bad:#c93a35;--badb:#fde0de;--line:#e6c9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10193a;--bg2:#143a4a;--card:#1a2756;--ink:#f6f1ff;--mut:#b3bfdc;--acc:#ff8fb1;--acc2:#6fd6cf;--ok:#7be0b0;--okb:#14473a;--bad:#ff9a94;--badb:#52242a;--line:#34447f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Nunito","Trebuchet MS",Verdana,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-size:clamp(16px,1.7vw,24px);line-height:1.4}
h1,h2,.big{font-family:"Lobster","Comic Sans MS","Trebuchet MS",cursive;font-weight:400;letter-spacing:.01em}
#app{max-width:1200px;margin:0 auto;padding:16px 20px 28px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top img{width:64px;height:64px;object-fit:cover;border-radius:50%;border:3px solid var(--acc)}
.lv{font-size:1.15em;color:var(--acc);flex:1;min-width:200px}
.meter{flex:1;min-width:220px}
.meter small{color:var(--mut);display:block;margin-bottom:3px}
.bar{height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--ok));transition:width .6s}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(16px,2.4vw,32px)}
.hero{display:grid;grid-template-columns:1fr minmax(180px,34%);gap:28px;align-items:center}
.hero img,.fin img{width:100%;border-radius:18px;display:block}
h1{font-size:clamp(34px,5vw,64px);margin:0 0 10px;color:var(--acc);line-height:1.05}
h2{font-size:clamp(28px,3.6vw,46px);margin:0 0 10px;color:var(--acc)}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:.6em 1.6em;background:var(--acc);color:#fff;cursor:pointer;margin-top:14px}
@media (prefers-color-scheme:dark){.btn{color:#10193a}}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.q{font-size:1.55em;font-weight:800;margin:0 0 6px}
.hint{color:var(--mut);font-size:.8em;margin:0 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc)}
.opt b{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--acc);font-weight:900}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.exp{margin-top:16px;padding:14px 18px;border-radius:16px;background:var(--bg);border-left:6px solid var(--acc2)}
.exp strong{display:block;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sm{color:var(--mut);font-size:.8em}
.fin{display:grid;grid-template-columns:minmax(180px,38%) 1fr;gap:28px;align-items:center}
.score{font-size:2.4em;color:var(--ok);font-weight:900}
.mapc{margin-top:18px}.mapw{display:grid;grid-template-columns:minmax(220px,42%) 1fr;gap:24px;align-items:center}.mapw svg{width:100%;height:auto}.pin{stroke:var(--card);stroke-width:3}.pin.ok{fill:var(--ok)}.pin.no{fill:var(--bad)}.pt{fill:var(--card);font:800 15px Verdana,sans-serif;text-anchor:middle}.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78em}.leg span{padding:6px 10px;border-radius:12px;border:2px solid var(--line)}.leg .ok{background:var(--okb);border-color:var(--ok)}.leg .no{background:var(--badb);border-color:var(--bad)}
@media (max-width:760px){.hero,.fin,.opts,.mapw,.leg{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{t:"Станция 1. Шар под нами",s:"Корабль «Мяу-1» подлетает к Земле. Приборы мигают: связи между странами рвутся. Капитан Мурз просит экипаж вспомнить, что такое глобализация.",q:[
{q:"Слово «глобализация» происходит от лат. globus — «шар». Что оно обозначает?",o:["Процесс формирования единого мирового экономического, политического, информационного, культурного и религиозного пространства","Рост числа жителей Земли","Разделение мира на враждующие блоки","Полный отказ стран от торговли"],c:0,e:"Глобализация — процесс формирования всемирного экономического, политического, информационного, культурного и религиозного пространства."},
{q:"Что служит ярким примером глобализации и объединения стран с обменом капиталом, рабочей силой, информацией и технологиями?",o:["Совет Безопасности ООН","Европейский Союз","Всемирный банк","Лига Наций"],c:1,e:"Европейский Союз: страны-участницы обмениваются капиталом, рабочей силой, информацией и технологиями."},
{q:"Экономическая глобализация создаёт единую рыночную экономику. Какой у неё минус?",o:["Страны становятся менее зависимыми друг от друга","Исчезают торговые связи","Страны становятся более уязвимыми в условиях кризиса","Падает уровень информации"],c:2,e:"Единый рынок даёт преимущества, но кризис в одной части мира быстро распространяется на другие."},
{q:"Распространение массовой интернациональной культуры и утрата традиций многих народов — это следствие какой формы глобализации?",o:["Политической","Экономической","Демографической","Культурной"],c:3,e:"Три формы глобализации: экономическая, политическая, культурная. Здесь речь о культурной."}]},
{t:"Станция 2. Тревожные сигналы",s:"На радаре вспыхивают красные точки. Это глобальные проблемы. Чтобы их распознать, нужно знать их признаки.",q:[
{q:"Какой из вариантов НЕ является признаком глобальной проблемы?",o:["Затрагивает всё человечество","Требует международного сотрудничества","Может быть решена силами одной страны","Остро стоит: от решения зависит судьба цивилизации"],c:2,e:"Глобальные проблемы невозможно решить в одной отдельно взятой стране: нужны совместные усилия."},
{q:"Когда глобальные проблемы встали перед человечеством и появился сам термин?",o:["Во второй половине XX в., термин — в конце 1960-х гг.","В XVI в., в эпоху Великих географических открытий","В начале XIX в.","В конце XXI в."],c:0,e:"Проблемы встали во второй половине XX в.; термин появился в конце 1960-х гг."},
{q:"Что означает признак «острота» глобальных проблем?",o:["Они касаются только богатых стран","От их решения зависит дальнейшее существование цивилизации","Они возникают случайно","Их можно отложить на потом"],c:1,e:"Острота: от решения проблем зависит дальнейшая судьба цивилизации, они настоятельно требуют решения."}]},
{t:"Станция 3. Пять главных тревог",s:"Корабль входит в зону помех. Экипажу нужно определить, с какой проблемой он столкнулся. Ошибёмся — энергия планеты не вырастет!",q:[
{q:"Рост рождаемости в бедных странах и перенаселение планеты относятся к проблеме:",o:["Экологической","Продовольственной","Демографической","Освоения космоса"],c:2,e:"Это демографическая проблема. Она связана с неравенством, голодом, здравоохранением и образованием."},
{q:"Разработка ядерных ракет и международный терроризм — это угроза, которая относится к проблеме:",o:["Войны и мира, предотвращения новой мировой войны","Мирового океана","Энергетической","«Север — Юг»"],c:0,e:"Проблема войны и мира: ядерное оружие и терроризм угрожают всему человечеству."},

function R(){var h=hdr();

else if(S.p==="story")h+='<div class="card hero"><div><h2>'+L[S.l].t+'</h2><p>'+L[S.l].s+'</p><p class="sm">Вопросов на станции: '+L[S.l].q.length+'</p><button class="btn" onclick="go(\'q\')">Начать</button></div><img src="'+IMG1+'" alt="Коты держатся за лапы вокруг Земли"></div>';
else if(S.p==="q"){var q=L[S.l].q[S.i],d=S.pick>-1;
h+='<div class="card"><p class="sm">Вопрос '+(S.n+1)+' из '+N+'</p><p class="q">'+q.q+'</p><p class="hint">'+(d?"":"Пишем букву в чат. Нажмите вариант, который выбрал класс.")+'</p><div class="opts">'+q.o.map(function(o,k){var c=d?(k===q.c?" ok":(k===S.pick?" bad":"")):"";return '<button class="opt'+c+'" '+(d?"disabled":"")+' onclick="pick('+k+')"><b>'+K[k]+'</b><span>'+o+'</span></button>'}).join("")+'</div>';
if(d)h+='<div class="exp"><strong>'+(S.pick===q.c?"Верно! Энергия +1":"Не совсем. Верный ответ: "+K[q.c])+'</strong>'+q.e+'</div><div class="row"><span class="sm">Клавиши 1–4 выбирают вариант, Enter — дальше</span><button class="btn" onclick="next()">Дальше</button></div>';
h+='</div>'}
